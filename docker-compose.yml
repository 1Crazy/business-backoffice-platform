services:
  postgres:
    image: postgres:16-alpine
    container_name: scrm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-scrm}
      POSTGRES_USER: ${POSTGRES_USER:-scrm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scrm}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scrm} -d ${POSTGRES_DB:-scrm}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: scrm-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:-dev-local-secret-change-me-32chars-minimum}
      JWT_ACCESS_TOKEN_TTL: ${JWT_ACCESS_TOKEN_TTL:-30m}
      DATABASE_URL: postgresql://${POSTGRES_USER:-scrm}:${POSTGRES_PASSWORD:-scrm}@postgres:5432/${POSTGRES_DB:-scrm}?schema=public
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080,http://localhost:8081,http://localhost:8082}
      RISK_THROTTLE_STORE: ${RISK_THROTTLE_STORE:-database}
      OPEN_INTEGRATION_SECRET_PEPPER: ${OPEN_INTEGRATION_SECRET_PEPPER:-dev-open-integration-pepper-change-me}
      OPEN_INTEGRATION_SECRET_ENCRYPTION_KEY: ${OPEN_INTEGRATION_SECRET_ENCRYPTION_KEY:-dev-open-integration-encryption-key-change-me}
      WEBHOOK_ALLOWED_DOMAINS: ${WEBHOOK_ALLOWED_DOMAINS:-}
    ports:
      - "3000:3000"
    volumes:
      - uploads-data:/app/uploads
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://0.0.0.0:3000/api/health', (response) => { response.resume(); process.exit(response.statusCode === 200 ? 0 : 1); }).on('error', () => process.exit(1))"
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  main-web:
    build:
      context: .
      dockerfile: apps/main-web/Dockerfile
      args:
        VITE_API_BASE_URL: /api
        VITE_OA_ENTRY: ${VITE_OA_ENTRY:-http://localhost:8081}
        VITE_SCRM_ENTRY: ${VITE_SCRM_ENTRY:-http://localhost:8082}
    container_name: main-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:80"

  oa-web:
    build:
      context: .
      dockerfile: apps/oa-web/Dockerfile
      args:
        VITE_API_BASE_URL: /api
    container_name: oa-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8081:80"

  scrm-web:
    build:
      context: .
      dockerfile: apps/scrm-web/Dockerfile
      args:
        VITE_API_BASE_URL: /api
    container_name: scrm-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8082:80"

volumes:
  postgres-data:
  uploads-data:
