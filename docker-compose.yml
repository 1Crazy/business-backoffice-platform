services:
  postgres:
    image: postgres:16-alpine
    container_name: scrm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-scrm}
      POSTGRES_USER: ${POSTGRES_USER:-scrm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scrm}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scrm} -d ${POSTGRES_DB:-scrm}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: scrm-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:-dev-secret-for-scrm-local}
      DATABASE_URL: postgresql://${POSTGRES_USER:-scrm}:${POSTGRES_PASSWORD:-scrm}@postgres:5432/${POSTGRES_DB:-scrm}?schema=public
    ports:
      - "3000:3000"
    volumes:
      - uploads-data:/app/uploads
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://0.0.0.0:3000/api/health', (response) => { response.resume(); process.exit(response.statusCode === 200 ? 0 : 1); }).on('error', () => process.exit(1))"
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  scrm-web:
    build:
      context: .
      dockerfile: apps/scrm-web/Dockerfile
      args:
        VITE_API_BASE_URL: /api
    container_name: scrm-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  postgres-data:
  uploads-data:
